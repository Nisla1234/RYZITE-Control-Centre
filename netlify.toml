[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Keep optional local-only SQLite binary out of Netlify Lambda bundle; production uses Neon PostgreSQL (pg)
  external_node_modules = ["better-sqlite3"]

# Route all /api/* requests to the Express Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback so /admin/, /admin/dashboard/, /admin/settings/, etc. load cleanly on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
